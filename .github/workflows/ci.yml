name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            services/translation-backend/pyproject.toml
            apps/desktop-overlay/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install "pip==26.1.2"
          .\.venv\Scripts\python.exe -m pip install --editable "./services/translation-backend[dev]"
          .\.venv\Scripts\python.exe -m pip install --editable "./apps/desktop-overlay"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run repository checks
        shell: pwsh
        run: .\scripts\check.ps1

      - name: Audit dependencies
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip_audit --local
          npm audit --audit-level=high

      - name: Run publication checks
        shell: pwsh
        run: .\scripts\publication-check.ps1
