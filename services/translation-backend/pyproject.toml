[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "submarine-translation-backend"
version = "0.1.0"
description = "Local translation service for Submarine"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "faster-whisper==1.2.1",
  "huggingface-hub==1.24.0",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "nvidia-cublas-cu12==12.9.2.10",
  "nvidia-cudnn-cu12==9.27.0.42",
  "pydantic-settings==2.16.1",
  "uvicorn[standard]==0.54.0",
]

[project.urls]
Homepage = "https://github.com/cheesebyter/Submarine"
Issues = "https://github.com/cheesebyter/Submarine/issues"
Repository = "https://github.com/cheesebyter/Submarine.git"

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.2",
  "types-jsonschema==4.26.0.20261006",
]

[tool.hatch.build.targets.wheel]
packages = ["src/submarine_backend"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["submarine_backend"]
